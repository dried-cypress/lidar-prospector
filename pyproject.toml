[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prospector"
version = "0.5.3"
description = "Reproducible archaeological landscape prospection from LiDAR and contextual evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "typer>=0.16,<1",
  "rich>=14,<15",
  "pydantic>=2.11,<3",
  "requests>=2.32,<3",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "scikit-learn==1.7.2",
]

[project.optional-dependencies]
geo = [
  "numpy>=2.2,<3",
  "rasterio>=1.4,<2",
  "scipy>=1.15,<2",
  "scikit-image>=0.25,<1",
  "matplotlib>=3.10,<4",
  "pillow>=12,<13",
  "fiona>=1.10,<2",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
]
training = [
  "joblib>=1.5,<2",
  "psycopg[binary]>=3.2,<4",
]
all = [
  "numpy>=2.2,<3",
  "rasterio>=1.4,<2",
  "scipy>=1.15,<2",
  "scikit-image>=0.25,<1",
  "matplotlib>=3.10,<4",
  "pillow>=12,<13",
  "fiona>=1.10,<2",
  "joblib>=1.5,<2",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
]

[project.scripts]
prospector = "prospector.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prospector"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
